<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miniflow | Website Development partner for Agency and Marketing Teams</title>
  <meta name="description" content="Miniflow is the website development partner for agency and marketing teams.">
  <meta name="theme-color" content="#D75B30">

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="256x256" href="assets/apple-touch-icon.png">

  <!-- Social sharing (crawlers need absolute URLs: change the domain if it differs) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tinyflow-dev.github.io/Miniflow-HTML/">
  <meta property="og:title" content="Miniflow | Website Development partner for Agency and Marketing Teams">
  <meta property="og:description" content="Miniflow is the website development partner for agency and marketing teams.">
  <meta property="og:image" content="https://tinyflow-dev.github.io/Miniflow-HTML/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Miniflow: Website Development partner for Agency and Marketing Teams">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://tinyflow-dev.github.io/Miniflow-HTML/assets/og-image.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">

  <link rel="stylesheet" href="css/styles.css">
  <script src="js/split.js" defer></script>
</head>
<body>
  <div class="mf-page">
    <div class="mf-topbar" aria-hidden="true"></div>

    <main class="mf-main">
      <header class="mf-hero">
        <a class="mf-logo" href="./" aria-label="Miniflow home">
          <svg class="mf-logo__mark" width="39" height="39" viewBox="0 0 100 100" aria-hidden="true">
            <rect class="mf-logo__tile" width="100" height="100" rx="22"></rect>
            <circle class="mf-logo__dot" cx="23" cy="50" r="6"></circle>
            <circle class="mf-logo__dot" cx="41" cy="50" r="8.5"></circle>
            <rect class="mf-logo__pill" x="55" y="39" width="27" height="22" rx="11"></rect>
          </svg>
          <span class="mf-logo__wordmark" aria-hidden="true"><span class="mf-logo__mini">mini</span><span class="mf-logo__flow">flow</span></span>
        </a>

        <h1 class="mf-title">
          Website Development partner<br>
          for <strong class="mf-title__highlight">Agency</strong> and <strong class="mf-title__highlight">Marketing</strong> Teams
        </h1>

        <a class="mf-btn" href="mailto:hello@miniflow.agency" target="_blank" rel="noopener" aria-label="Contact Us at hello@miniflow.agency">
          <span class="mf-roll" aria-hidden="true">Contact Us</span>
          <span class="mf-swap" aria-hidden="true">
            <svg class="mf-swap__icon mf-swap__icon--current" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3.5 6.5l8.5 6.5 8.5-6.5"></path></svg>
            <svg class="mf-swap__icon mf-swap__icon--next" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </span>
        </a>
      </header>

      <div class="mf-columns">
        <section class="mf-section mf-section--projects" aria-labelledby="projects-label">
          <h2 class="mf-section__label" id="projects-label">SELECTED PROJECTS</h2>
          <ul class="mf-list">
            <li class="mf-list__item">
              <a class="mf-link" href="https://riverside.com/" target="_blank" rel="noopener" aria-label="Riverside.com">
                <span class="mf-link__main">
                  <img class="mf-link__icon" src="assets/projects/riverside.png" alt="" width="32" height="32">
                  <span class="mf-roll" aria-hidden="true">Riverside.com</span>
                </span>
                <span class="mf-swap mf-swap--diagonal" aria-hidden="true">
                  <svg class="mf-swap__icon mf-swap__icon--current" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"></path></svg>
                  <svg class="mf-swap__icon mf-swap__icon--next" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"></path></svg>
                </span>
              </a>
            </li>
            <li class="mf-list__item">
              <a class="mf-link" href="https://www.sharewillow.com/" target="_blank" rel="noopener" aria-label="Sharewillow.com">
                <span class="mf-link__main">
                  <img class="mf-link__icon" src="assets/projects/sharewillow.png" alt="" width="32" height="32">
                  <span class="mf-roll" aria-hidden="true">Sharewillow.com</span>
                </span>
                <span class="mf-swap mf-swap--diagonal" aria-hidden="true">
                  <svg class="mf-swap__icon mf-swap__icon--current" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"></path></svg>
                  <svg class="mf-swap__icon mf-swap__icon--next" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"></path></svg>
                </span>
              </a>
            </li>
            <li class="mf-list__item">
              <a class="mf-link" href="https://www.workstreet.com/" target="_blank" rel="noopener" aria-label="Workstreet.com">
                <span class="mf-link__main">
                  <img class="mf-link__icon" src="assets/projects/workstreet.png" alt="" width="32" height="32">
                  <span class="mf-roll" aria-hidden="true">Workstreet.com</span>
                </span>
                <span class="mf-swap mf-swap--diagonal" aria-hidden="true">
                  <svg class="mf-swap__icon mf-swap__icon--current" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"></path></svg>
                  <svg class="mf-swap__icon mf-swap__icon--next" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"></path></svg>
                </span>
              </a>
            </li>
            <li class="mf-list__item">
              <a class="mf-link" href="https://www.gable.ai/" target="_blank" rel="noopener" aria-label="Gable.ai">
                <span class="mf-link__main">
                  <img class="mf-link__icon" src="assets/projects/gable.png" alt="" width="32" height="32">
                  <span class="mf-roll" aria-hidden="true">Gable.ai</span>
                </span>
                <span class="mf-swap mf-swap--diagonal" aria-hidden="true">
                  <svg class="mf-swap__icon mf-swap__icon--current" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"></path></svg>
                  <svg class="mf-swap__icon mf-swap__icon--next" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"></path></svg>
                </span>
              </a>
            </li>
          </ul>
        </section>

        <section class="mf-section mf-section--stack" aria-labelledby="stack-label">
          <h2 class="mf-section__label" id="stack-label">OUR TECH STACK</h2>
          <ul class="mf-list">
            <li class="mf-list__item mf-stack-item"><img class="mf-stack-item__icon" src="assets/stack/webflow.png" alt="" width="32" height="32">Webflow</li>
            <li class="mf-list__item mf-stack-item"><img class="mf-stack-item__icon" src="assets/stack/astro.png" alt="" width="32" height="32">Astro</li>
            <li class="mf-list__item mf-stack-item"><img class="mf-stack-item__icon" src="assets/stack/next.png" alt="" width="32" height="32">Next.js</li>
            <li class="mf-list__item mf-stack-item"><img class="mf-stack-item__icon" src="assets/stack/sanity.png" alt="" width="32" height="32">Sanity</li>
          </ul>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
